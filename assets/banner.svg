<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#050505"/>
<stop offset="1" stop-color="#0D1117"/>
</linearGradient>

<linearGradient id="green">
<stop stop-color="#39FF14"/>
<stop offset="1" stop-color="#00FFC6"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="8"/>
</filter>

</defs>


<!-- Background -->

<rect width="1200" height="400" fill="url(#bg)"/>


<!-- Cyber Grid -->

<path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200"
stroke="#39FF14"
opacity="0.12"/>

<path d="M150 0V400M300 0V400M450 0V400M600 0V400M750 0V400M900 0V400M1050 0V400"
stroke="#39FF14"
opacity="0.08"/>


<!-- Glow -->

<circle cx="600" cy="200" r="120"
fill="#39FF14"
opacity="0.15"
filter="url(#glow)"/>


<!-- Title -->

<text
x="600"
y="170"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="72"
font-weight="700"
fill="url(#green)">

INFO TECH VK

</text>


<!-- Subtitle -->

<text
x="600"
y="230"
text-anchor="middle"
font-family="Inter, sans-serif"
font-size="26"
fill="#F0F6FC">

Cloudflare Workers • Telegram Bots • Networking • Automation

</text>


<!-- Status -->

<text
x="600"
y="290"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="20"
fill="#39FF14">

● SYSTEM ONLINE

</text>


<!-- Animation -->

<animateTransform
attributeName="transform"
type="translate"
from="0 0"
to="0 5"
dur="3s"
repeatCount="indefinite"/>


</svg>
